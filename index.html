<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VAULT" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/app.css" />
  <title>VAULT — 자산 금고</title>
</head>
<body>
  <div id="app"></div>

  <!-- 화면 하단 탭바 (로그인 후에만 표시) -->
  <nav id="tabbar" class="tabbar hidden">
    <button data-nav="dashboard" class="tab active"><span class="ti">◈</span><span>대시보드</span></button>
    <button data-nav="income" class="tab"><span class="ti">＄</span><span>수입</span></button>
    <button data-nav="work" class="tab"><span class="ti">◷</span><span>근무</span></button>
    <button data-nav="expenses" class="tab"><span class="ti">▽</span><span>지출</span></button>
    <button data-nav="settings" class="tab"><span class="ti">⚙</span><span>설정</span></button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/allocation.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
